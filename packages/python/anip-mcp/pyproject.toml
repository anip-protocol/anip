[project]
name = "anip-mcp"
version = "0.24.18"
description = "ANIP MCP bindings — expose ANIPService capabilities as MCP tools"
requires-python = ">=3.11"
dependencies = [
    "anip-service==0.24.18",
    "fastapi>=0.115.0",
    # The 2.x MCP SDK removed the lowlevel Server decorators this package uses
    # (list_tools, call_tool). Stay on 1.x until the bindings are ported.
    "mcp>=1.0.0,<2",
]
authors = [{ name = "ANIP Protocol", email = "team@anip.dev" }]
license = { text = "Apache-2.0" }
keywords = ["anip", "agent", "protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Repository = "https://github.com/anip-protocol/anip"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
