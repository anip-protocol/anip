name: CI — Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_test: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Everything that goes into the Studio bundle, plus every place
            # the Inspect bundle is committed. studio/sync.sh compiles
            # packages/typescript/client and packages/typescript/vue from
            # source, so a change there changes the synced assets.
            src:
              - "studio/**"
              - "packages/typescript/client/**"
              - "packages/typescript/vue/**"
              - "packages/typescript/tsconfig.base.json"
              - "packages/python/anip-studio/**"
              - "packages/typescript/studio/**"
              - "packages/go/studioapi/**"
              - "packages/java/anip-studio/**"
              - "packages/csharp/src/Anip.Studio/**"
              - ".github/workflows/ci-studio.yml"

  build:
    needs: changes
    if: needs.changes.outputs.should_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Studio API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./packages/python/anip-core[dev]"
          pip install -e "./packages/python/anip-crypto[dev]"
          pip install -e "./packages/python/anip-server[dev]"
          pip install -e "./packages/python/anip-service[dev]"
          pip install -e "./packages/python/anip-fastapi[dev]"
          pip install -r studio/server/requirements.txt

      - name: Test SQLite desktop backend
        run: PYTHONPATH=. pytest studio/server_sqlite_tests -q

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: studio
        run: npm ci

      - name: Test
        working-directory: studio
        run: npx vitest run

      # Build mode, as in "npm run build". The root tsconfig.json only holds
      # project references ("files": []), so "vue-tsc --noEmit" checks nothing.
      - name: Type check
        working-directory: studio
        run: npx vue-tsc -b

      # sync.sh rebuilds the Inspect bundle and copies it into all five
      # runtime packages, where it is committed (Go needs the files for
      # go:embed). Every copy must match what the current sources build.
      - name: Build and verify synced assets
        run: |
          bash studio/sync.sh
          synced_dirs=(
            packages/python/anip-studio/src/anip_studio/static
            packages/typescript/studio/static
            packages/go/studioapi/static
            packages/java/anip-studio/src/main/resources/studio
            packages/csharp/src/Anip.Studio/static
          )
          stale=0
          for dir in "${synced_dirs[@]}"; do
            if [ -n "$(git status --porcelain -- "$dir")" ]; then
              echo "::error::Studio assets are stale in $dir"
              git status --short -- "$dir"
              stale=1
            fi
          done
          if [ "$stale" -ne 0 ]; then
            echo "The committed Studio assets do not match what the sources build."
            echo "Run 'bash studio/sync.sh' and commit all five copies."
            exit 1
          fi
          echo "Studio assets are in sync in all ${#synced_dirs[@]} runtime packages."

      - name: Docker build smoke test
        run: |
          docker build -t anip-studio-api-test -f studio/server/Dockerfile .
          docker build -t anip-studio-web-test -f studio/Dockerfile.standalone .

      - name: Compose smoke test
        run: studio/scripts/smoke-compose.sh

  studio-ci:
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Passed
        if: needs.build.result == 'success' || needs.build.result == 'skipped'
        run: echo "Studio CI passed"
      - name: Failed
        if: needs.build.result == 'failure' || needs.build.result == 'cancelled'
        run: exit 1
